<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spilman Real - Library Probe</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .success { color: #22c55e; }
    .failure { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Spilman Real - Library Probe</h1>
  <p>Importing libraries from esm.sh and checking API availability...</p>
  <div id="loading">Loading...</div>
  <pre id="output"></pre>

  <script type="module">
    const output = document.getElementById('output');

    function log(msg) {
      output.textContent += msg + '\n';
      console.log(msg);
    }

    // Custom hex utilities for hash-wasm
    function hexArrayToHex(bytes) {
      return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function bytesToHex(bytes) {
      return hexArrayToHex(bytes);
    }

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    const results = {
      cashuTsExports: [],
      hasGetSharedSecret: false,
      hasSchnorrSign: false,
      hasSchnorrVerify: false,
      hasSha256: false,
      hasBytesToHex: false,
      hasHexToBytes: false,
      hasCashuMint: false,
      hasCashuWallet: false,
      ecdhSmokeTest: false,
      sha256SmokeTest: false,
      nobleCurvesDetails: {},
      nobleHashesDetails: {},
    };

    try {
      log('=== Loading cashu-ts ===');
      const cashuModule = await import('https://esm.sh/@cashu/cashu-ts@4.2.1');
      log('cashu-ts loaded successfully');
      log('Named exports: ' + Object.keys(cashuModule).join(', '));
      results.cashuTsExports = Object.keys(cashuModule);
      results.hasCashuMint = typeof cashuModule.CashuMint === 'function';
      results.hasCashuWallet = typeof cashuModule.CashuWallet === 'function';
      log('  CashuMint: ' + (results.hasCashuMint ? '✓' : '✗'));
      log('  CashuWallet: ' + (results.hasCashuWallet ? '✓' : '✗'));
    } catch (e) {
      log('  ERROR: ' + e.message);
    }

    try {
      log('\n=== Loading noble/curves ===');
      const { schnorr, secp256k1 } = await import('https://esm.sh/@noble/curves@2.2.0/secp256k1');
      log('noble/curves loaded successfully');
      log('Named exports: ' + Object.keys(secp256k1).filter(k => !k.startsWith('_') && k !== 'Point').join(', '));

      results.hasGetSharedSecret = typeof secp256k1.getSharedSecret === 'function';
      results.hasSchnorrSign = typeof schnorr.sign === 'function';
      results.hasSchnorrVerify = typeof schnorr.verify === 'function';
      log('  getSharedSecret: ' + (results.hasGetSharedSecret ? '✓' : '✗'));
      log('  schnorr.sign: ' + (results.hasSchnorrSign ? '✓' : '✗'));
      log('  schnorr.verify: ' + (results.hasSchnorrVerify ? '✓' : '✗'));

      // ECDH smoke test
      try {
        const privkey = secp256k1.utils.randomSecretKey();
        const pubkey = secp256k1.getPublicKey(privkey, true); // compressed
        const sharedSecret = secp256k1.getSharedSecret(privkey, pubkey);
        log('  ECDH smoke test: ✓');
        log('    Privkey: ' + bytesToHex(privkey));
        log('    Pubkey: ' + bytesToHex(pubkey));
        log('    SharedSecret: ' + bytesToHex(sharedSecret));
        results.ecdhSmokeTest = true;
      } catch (e) {
        log('  ECDH smoke test: ✗ ' + e.message);
      }

      // Log noble/curves details for debugging
      results.nobleCurvesDetails = {
        hasUtils: typeof secp256k1.utils !== 'undefined',
        hasUtilsRandomSecretKey: typeof secp256k1.utils.randomSecretKey === 'function',
        hasUtilsBytesToHex: typeof secp256k1.utils.bytesToHex === 'function',
        hasUtilsIsValidSecretKey: typeof secp256k1.utils.isValidSecretKey === 'function',
        exports: Object.keys(secp256k1),
        utilsExports: typeof secp256k1.utils === 'object' ? Object.keys(secp256k1.utils) : 'N/A',
      };
    } catch (e) {
      log('  ERROR: ' + e.message);
    }

    try {
      log('\n=== Loading sha256 ===');
      const sha256Module = await import('https://esm.sh/sha256');
      log('sha256 loaded successfully');

      // SHA-256 smoke test
      try {
        const sha256 = sha256Module.default;
        const hash = sha256('hello');
        log('  SHA-256 smoke test: ✓');
        log('    Input: hello');
        log('    Hash: ' + hexArrayToHex(hash));
        results.hasSha256 = true;
        results.sha256SmokeTest = true;
        results.sha256Hash = hexArrayToHex(hash);
      } catch (e) {
        log('  SHA-256 smoke test: ✗ ' + e.message);
        results.hasSha256 = false;
      }

      // Implement our own bytesToHex and hexToBytes
      results.hasBytesToHex = true;
      results.hasHexToBytes = true;
      log('  bytesToHex: ✓ (custom implementation)');
      log('  hexToBytes: ✓ (custom implementation)');
    } catch (e) {
      log('  ERROR: ' + e.message);
    }

    results.allChecksPassed =
      results.hasGetSharedSecret &&
      results.hasSchnorrSign &&
      results.hasSchnorrVerify &&
      results.hasSha256 &&
      results.hasBytesToHex &&
      results.hasHexToBytes &&
      results.hasCashuMint &&
      results.hasCashuWallet &&
      results.ecdhSmokeTest &&
      results.sha256SmokeTest;

    log('\n=== Summary ===');
    log('All checks passed: ' + (results.allChecksPassed ? '✓' : '✗'));
    log(JSON.stringify(results, null, 2));

    // Expose to window for Playwright verification
    window.probeResult = results;
    document.getElementById('loading').textContent = 'Done! Check the output above.';
  </script>
</body>
</html>
