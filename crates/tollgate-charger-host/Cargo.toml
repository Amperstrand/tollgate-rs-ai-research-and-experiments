[package]
name = "tollgate-charger-host"
description = "Meter-module delivery driver for the charger MQTT contract — pure message translation around tollgate-core's DeliveryEngine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tollgate-core = { workspace = true }

# Real-broker parity tier: only compiled with --features real-broker so the
# default build/test path stays dependency-free (pure driver + mock).
rumqttc = { version = "0.24", optional = true }
tokio = { workspace = true, optional = true }

[features]
real-broker = ["dep:rumqttc", "dep:tokio"]

[lints]
workspace = true
