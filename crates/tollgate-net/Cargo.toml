[package]
name = "tollgate-net"
description = "TollGate node — sells metered network access over IP (FIPS support later)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "tollgate"

[[bin]]
name = "tollgate"
path = "src/main.rs"

[dependencies]
tollgate-core = { workspace = true }
tollgate-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
secp256k1 = { workspace = true }
cashu = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
# tolltop TUI (also pulls crossterm as its default backend).
ratatui = "0.29"
nostr = { workspace = true, optional = true }
cdk = { workspace = true, optional = true }
cdk-sqlite = { workspace = true, optional = true }
url = { version = "2", optional = true }
# openwrt platform dependencies
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
ipnetwork = { version = "0.20", optional = true }
rtnetlink = { version = "0.21", optional = true }
netlink-packet-route = { version = "0.30", optional = true }
netlink-packet-core = { version = "0.8", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
mockall = "0.13"

[lints]
workspace = true

[features]
default = []
v1-compat = ["dep:nostr", "dep:cdk", "dep:cdk-sqlite", "dep:url"]
openwrt = [
    "tokio/process",
    "dep:async-trait",
    "dep:futures",
    "dep:ipnetwork",
    "dep:rtnetlink",
    "dep:netlink-packet-route",
    "dep:netlink-packet-core",
]
