[package]
name = "tollgate-net"
description = "TollGate node — sells metered network access over IP (FIPS support later)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "tollgate"

[[bin]]
name = "tollgate"
path = "src/main.rs"

[dependencies]
tollgate-core = { workspace = true }
tollgate-protocol = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
secp256k1 = { workspace = true }
cashu = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# v1-compat: HTTP/JSON server on port 2121 (Go v1 protocol compatibility).
# Optional — excluded from minimal/v2-only builds. ESP32 doesn't include
# tollgate-net at all, so this has zero embedded impact.
sha2 = { workspace = true, optional = true }

[features]
default = ["v1-compat"]
v1-compat = ["dep:sha2"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
