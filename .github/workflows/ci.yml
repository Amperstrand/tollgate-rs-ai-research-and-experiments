name: CI

on:
  push:
    branches: [master, experimental]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (v1-compat)
        run: cargo clippy --workspace --all-targets --features v1-compat -- -D warnings
      - name: Clippy (spilman)
        run: cargo clippy --workspace --all-targets --features v1-compat,spilman -- -D warnings
      - name: Clippy (openwrt)
        run: cargo clippy --workspace --all-targets --features openwrt -- -D warnings
      - name: Build (default)
        run: cargo build --workspace --all-targets
      - name: Build (v1-compat+spilman)
        run: cargo build --workspace --all-targets --features v1-compat,spilman
      - name: Build (openwrt)
        run: cargo build --workspace --all-targets --features openwrt
      - name: Test (default)
        run: cargo test --workspace
      - name: Test (v1-compat)
        run: cargo test --workspace --features v1-compat
      - name: Test (openwrt)
        run: cargo test --workspace --features openwrt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Guards the constraint that the core libraries stay no_std (esp32-ready):
  # they must build against a target that has no std.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build core + protocol for a bare-metal target
        run: cargo build -p tollgate-protocol -p tollgate-core --target thumbv7em-none-eabihf

  # Build the single test image ONCE, then fan out integration suites that reuse
  # it (mirrors the FIPS build-once / run-many shape). The image is shared via a
  # docker-save artifact so each matrix leg loads it instead of rebuilding.
  image:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - name: Build tollgate-test image
        run: testing/scripts/build.sh
      - name: Save image to a tarball
        run: docker save tollgate-test:latest -o /tmp/tollgate-test.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: tollgate-test-image
          path: /tmp/tollgate-test.tar
          retention-days: 1

  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [image]
    strategy:
      fail-fast: false
      matrix:
        suite: [detect, bootstrap, exhaust, metering, drift, protocol-disconnect, protocol-reject]
    steps:
      - uses: actions/checkout@v5
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: tollgate-test-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/tollgate-test.tar
      - name: Run ${{ matrix.suite }}
        # SKIP_BUILD reuses the loaded image instead of rebuilding it.
        run: SKIP_BUILD=1 testing/${{ matrix.suite }}/test.sh

  mips-cross:
    name: MIPS Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MIPS cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mips-linux-gnu
      - uses: dtolnay/rust-toolchain@nightly
      - name: Add MIPS target
        run: rustup target add mips-unknown-linux-gnu --toolchain nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: mips-cross
      - name: Configure build-std
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'CFG'
          [unstable]
          build-std = ["std", "panic_abort"]

          [target.mips-unknown-linux-gnu]
          linker = "mips-linux-gnu-gcc"
          CFG
      - name: Check tollgate-net for MIPS
        env:
          CC_mips_unknown_linux_gnu: mips-linux-gnu-gcc
          AR_mips_unknown_linux_gnu: mips-linux-gnu-ar
        run: cargo +nightly check --features v1-compat -Z build-std --target mips-unknown-linux-gnu -p tollgate-net
