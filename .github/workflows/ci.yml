name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --workspace --all-targets
      - run: cargo check -p tollgate-net --features spilman --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tollgate-net --features spilman --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check -p tollgate-core

  cdk-integration:
    name: CDK Integration (testnut)
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run CDK integration tests
        id: run-tests
        run: |
          set -o pipefail
          cargo test -p tollgate-net --test cdk_integration -- --ignored --nocapture 2>build.log | tee protocol-report.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload protocol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-report
          path: |
            protocol-report.log
            build.log
          retention-days: 14

      - name: Upload bootstrap trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-trace-artifact
          path: target/protocol-traces/
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::CDK integration tests failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  spilman-integration:
    name: Spilman Integration (testnut)
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Spilman integration tests
        id: run-tests
        run: |
          set -o pipefail
          cargo test -p tollgate-net --test spilman_integration --features spilman -- --ignored --nocapture 2>build.log | tee spilman-report.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload spilman protocol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-protocol-report
          path: |
            spilman-report.log
            build.log
          retention-days: 14

      - name: Upload spilman trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-trace-artifact
          path: target/protocol-traces/
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::Spilman integration tests failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  build-pages:
    name: Build Protocol Trace Pages
    if: github.ref == 'refs/heads/experimental'
    needs: [cdk-integration, spilman-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bootstrap-trace-artifact
          path: traces/bootstrap

      - uses: actions/download-artifact@v5
        with:
          name: spilman-trace-artifact
          path: traces/spilman

      - name: Build unified protocol trace page
        run: |
          mkdir -p pages

          cat > pages/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TollGate — Protocol Traces</title>
            <script type="module">
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
              mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                sequence: { useMaxWidth: false, wrap: false, actorMargin: 80 }
              });
            </script>
            <style>
              :root { --buyer: #0969da; --seller: #1a7f37; --mint: #9a6700; --bg: #f6f8fa; --card: #ffffff; --border: #d1d9e0; --text: #1f2328; --muted: #656d76; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 960px; margin: 0 auto; padding: 24px; background: var(--bg); color: var(--text); line-height: 1.6; }
              header { margin-bottom: 32px; }
              header h1 { font-size: 1.75rem; margin-bottom: 4px; }
              header p { color: var(--muted); font-size: 0.95rem; }
              h2 { font-size: 1.25rem; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
              .actors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
              .actor { padding: 18px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
              .actor h3 { font-size: 0.95rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
              .actor p { font-size: 0.85rem; color: var(--muted); }
              .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
              .dot-buyer { background: var(--buyer); }
              .dot-seller { background: var(--seller); }
              .dot-mint { background: var(--mint); }
              .mermaid { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; overflow-x: auto; margin-bottom: 24px; max-width: 100%; position: relative; -webkit-overflow-scrolling: touch; }
              .mermaid::after { content: '\2190 scroll \2192'; display: block; text-align: center; color: var(--muted); font-size: 0.72rem; padding-top: 8px; }
              @media (min-width: 800px) { .mermaid::after { display: none; } }
              .no-data { color: var(--muted); font-style: italic; padding: 16px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
              .legend { font-size: 0.82rem; color: var(--muted); margin: -16px 0 24px; }
              .step { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
              .step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
              .step-num { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 24px; }
              .step-dir { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
              .step-dir.req { background: #ddf4ff; color: var(--buyer); }
              .step-dir.res { background: #dafbe1; color: var(--seller); }
              .step-title { font-weight: 600; font-size: 0.95rem; }
              .step-explain { font-size: 0.88rem; color: var(--muted); margin-bottom: 8px; }
              .step-meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
              .step-meta code { background: rgba(0,0,0,0.04); padding: 1px 5px; border-radius: 3px; font-size: 0.78rem; }
              details { margin: 24px 0; }
              summary { cursor: pointer; font-weight: 600; color: var(--text); font-size: 0.9rem; }
              pre { background: var(--text); color: #e6edf3; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.5; max-height: 400px; }
              #tooltip { position: absolute; display: none; background: var(--text); color: #e6edf3; padding: 12px 16px; border-radius: 8px; font-size: 0.82rem; max-width: 380px; z-index: 100; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.25); line-height: 1.5; }
              #tooltip .tt-type { font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; }
              #tooltip .tt-row { display: flex; gap: 8px; }
              #tooltip .tt-label { color: #8b949e; min-width: 60px; }
              #tooltip .tt-val { color: #e6edf3; word-break: break-all; }
              .balance-gauge { height: 6px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
              .balance-gauge-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
              .phase-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; list-style: none; padding: 0; }
              .phase-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; padding: 2px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); }
              .phase-swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
              .balance-timeline { display: flex; align-items: flex-end; gap: 4px; height: 80px; padding: 12px 0; }
              .balance-bar { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 60px; }
              .balance-bar-fill { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.3s; }
              .balance-bar-label { font-size: 0.65rem; color: var(--muted); margin-top: 4px; }
              .balance-bar-val { font-size: 0.7rem; font-weight: 600; margin-bottom: 2px; }
              .step-dir.actor-buyer { background: #ddf4ff; color: var(--buyer); }
              .step-dir.actor-seller { background: #dafbe1; color: var(--seller); }
              .step-dir.actor-mint { background: #fff8c5; color: var(--mint); }
              .step-dir.note { background: rgba(0,0,0,0.04); color: var(--muted); }
              @media (max-width: 640px) { .actors { grid-template-columns: 1fr; } }
              .section-divider { border: none; margin: 0; padding: 0; }
              .section-divider-inner { display: flex; align-items: center; gap: 16px; margin: 48px 0 40px; }
              .section-divider-inner::before, .section-divider-inner::after { content: ''; flex: 1; border-top: 2px solid var(--border); }
              .section-divider-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
              nav.section-nav { position: sticky; top: 0; z-index: 50; background: rgba(246,248,250,0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); margin: 0 -24px 24px; padding: 10px 24px; display: flex; gap: 24px; align-items: center; }
              nav.section-nav .nav-brand { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-right: auto; }
              nav.section-nav a { font-size: 0.85rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 4px 12px; border-radius: 6px; transition: all 0.15s ease; }
              nav.section-nav a:hover { color: var(--text); background: rgba(0,0,0,0.04); }
              nav.section-nav a.active { color: var(--buyer); background: #ddf4ff; font-weight: 600; }
              .teacher-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin: 24px 0 28px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
              .teacher-panel h3 { font-size: 1.05rem; margin-bottom: 8px; }
              .teacher-intro { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
              .lesson-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
              .lesson-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: #fbfcfd; }
              .lesson-card strong { display: block; margin-bottom: 4px; }
              .lesson-card p { color: var(--muted); font-size: 0.86rem; }
              .scenario-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
              .scenario-buttons button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 0.84rem; cursor: pointer; }
              .scenario-buttons button.active { border-color: var(--buyer); background: #ddf4ff; color: var(--buyer); font-weight: 600; }
              .scenario-output { border-left: 4px solid var(--buyer); background: #f8fbff; border-radius: 8px; padding: 16px 18px; }
              .scenario-output h4 { font-size: 0.98rem; margin-bottom: 6px; }
              .scenario-output p { font-size: 0.88rem; color: var(--muted); margin-bottom: 10px; }
              .claim-steps { margin: 0; padding-left: 20px; font-size: 0.86rem; color: var(--text); }
              .claim-steps li { margin-bottom: 6px; }
              .call-pill { display: inline-block; background: rgba(0,0,0,0.05); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; }
              .claim-matrix { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.84rem; }
              .claim-matrix th, .claim-matrix td { border: 1px solid var(--border); padding: 9px 10px; text-align: left; vertical-align: top; }
              .claim-matrix th { background: #f6f8fa; font-weight: 600; }
              .claim-lab { margin-top: 18px; }
              .claim-lab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0; }
              .claim-lab-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #fbfcfd; }
              .claim-lab-card h4 { font-size: 0.9rem; margin-bottom: 6px; }
              .claim-lab-code { white-space: pre-wrap; word-break: break-all; background: #1f2328; color: #e6edf3; padding: 12px; border-radius: 8px; font-size: 0.75rem; max-height: 220px; overflow: auto; }
              .timelock { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #fee2e2 0 70%, #dcfce7 70% 100%); margin: 10px 0 6px; position: relative; }
              .timelock::after { content: 'expiry unlock'; position: absolute; left: 70%; top: 14px; transform: translateX(-50%); color: var(--muted); font-size: 0.72rem; }
              html { scroll-padding-top: 60px; }
              @media (max-width: 720px) { .lesson-grid, .claim-lab-grid { grid-template-columns: 1fr; } }
              #state-popup { display: none; position: fixed; z-index: 200; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); max-width: 520px; min-width: 340px; max-height: 80vh; overflow-y: auto; font-size: 0.85rem; }
              #state-popup .sp-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #f6f8fa; border-radius: 12px 12px 0 0; }
              #state-popup .sp-header h4 { font-size: 0.95rem; margin: 0; }
              #state-popup .sp-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); padding: 0 4px; }
              #state-popup .sp-close:hover { color: var(--text); }
              #state-popup .sp-body { padding: 14px 16px; }
              .sp-state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
              .sp-state-card { border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: #fbfcfd; }
              .sp-state-card h5 { font-size: 0.82rem; margin: 0 0 6px; }
              .sp-state-card ul { margin: 0; padding-left: 16px; font-size: 0.8rem; color: var(--muted); }
              .sp-balance-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; background: var(--border); }
              .sp-balance-bar-fill { height: 100%; }
              .sp-proof-row { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 3px 0; }
              .sp-proof-amount { font-weight: 600; min-width: 32px; }
              .sp-proof-hex { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
              .sp-copy-btn { background: none; border: 1px solid var(--border); border-radius: 3px; font-size: 0.7rem; cursor: pointer; padding: 1px 6px; color: var(--muted); }
              .sp-copy-btn:hover { background: rgba(0,0,0,0.04); color: var(--text); }
              .sp-claim-tabs { display: flex; gap: 0; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
              .sp-claim-tab { flex: 1; text-align: center; padding: 8px 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; background: var(--card); border: none; color: var(--muted); border-right: 1px solid var(--border); }
              .sp-claim-tab:last-child { border-right: none; }
              .sp-claim-tab.active { background: #ddf4ff; color: var(--buyer); font-weight: 600; }
              .sp-claim-content { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #f8fbff; }
              .sp-claim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
              .sp-claim-label { font-size: 0.78rem; font-weight: 600; }
              .sp-claim-val { font-size: 0.78rem; color: var(--muted); }
              .sp-timelock-mini { height: 6px; border-radius: 999px; background: linear-gradient(90deg, #fee2e2 0 70%, #dcfce7 70% 100%); margin: 8px 0 4px; }
              .sp-timelock-label { font-size: 0.7rem; color: var(--muted); display: flex; justify-content: space-between; }
              .sp-denom-section { background: #f8fbff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
              .sp-denom-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
              .sp-denom-bar { display: flex; gap: 3px; align-items: stretch; min-height: 48px; flex-wrap: wrap; }
              .sp-denom-block { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; padding: 6px 4px; min-width: 0; transition: opacity 0.15s ease; }
              .sp-denom-block:hover { opacity: 0.85; }
              .sp-denom-amount { font-size: 0.72rem; font-weight: 600; line-height: 1.2; }
              .sp-denom-power { font-size: 0.62rem; opacity: 0.75; margin-top: 2px; }
              .sp-denom-count { font-size: 0.6rem; opacity: 0.7; margin-top: 1px; }
              .sp-denom-split { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; font-size: 0.8rem; }
              .sp-denom-split-arrow { display: inline-block; width: 16px; text-align: center; }
              .sp-denom-legend { font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
              .sp-denom-legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 3px; }
              @media (max-width: 520px) { .sp-denom-bar { flex-wrap: wrap; } .sp-denom-block { min-width: 28px; } }
              @media (max-width: 520px) { #state-popup { min-width: 280px; max-width: 95vw; } .sp-state-grid { grid-template-columns: 1fr; } }
             </style>
          </head>
          <body>
            <nav class="section-nav" id="nav">
              <span class="nav-brand">TollGate</span>
              <a href="#bootstrap" data-section="bootstrap">Bootstrap Token</a>
              <a href="#spilman" data-section="spilman">Spilman Channel</a>
            </nav>
            <header>
              <h1>TollGate Protocol Traces</h1>
              <p>Auto-generated from integration tests — Bootstrap token payment &amp; Spilman payment channel lifecycle</p>
            </header>

            <!-- ============================================================ -->
            <!-- SECTION 1: Bootstrap Token Payment                           -->
            <!-- ============================================================ -->
            <section id="bootstrap">
              <h2>Bootstrap Token Payment</h2>
              <p style="margin-bottom:16px">
                A <strong>Buyer</strong> wants network access from a <strong>Seller</strong>.
                The Buyer pays with <a href="https://cashu.space/" target="_blank">Cashu ecash</a> —
                digital bearer tokens that work like electronic cash.
                The <strong>Mint</strong> issues and verifies these tokens.
                No accounts, no registration — the Buyer just sends tokens and gets access.
              </p>
              <div class="actors">
                <div class="actor">
                  <h3><span class="dot dot-buyer"></span>Buyer</h3>
                  <p>Wants network access. Pays the Seller with Cashu ecash tokens minted from the Mint.</p>
                </div>
                <div class="actor">
                  <h3><span class="dot dot-seller"></span>Seller</h3>
                  <p>Sells bandwidth at <strong>10 sat/second + 1 sat/byte</strong>. Verifies every token with the Mint before granting access.</p>
                </div>
                <div class="actor">
                  <h3><span class="dot dot-mint"></span>Mint</h3>
                  <p>Issues and verifies Cashu ecash. This test uses <code>testnut.cashu.exchange</code> (auto-paying fake wallet).</p>
                </div>
              </div>
            </section>

            <section>
              <h2>Protocol sequence — Bootstrap</h2>
              <p class="legend">
                Solid arrows (→) are requests &middot;
                Dashed arrows (⇢) are responses &middot;
                Numbers are auto-sequenced &middot;
                 Timing is relative to start
               </p>
               <ul class="phase-legend">
