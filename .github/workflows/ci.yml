name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check -p tollgate-core

  cdk-integration:
    name: CDK Integration (testnut)
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run CDK integration tests
        id: run-tests
        run: |
          set -o pipefail
          cargo test -p tollgate-net --test cdk_integration -- --ignored --nocapture 2>build.log | tee protocol-report.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build protocol trace page
        if: always()
        run: |
          mkdir -p pages
          TRACE_DIR="target/protocol-traces"

          cat > pages/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TollGate Protocol Traces</title>
            <script type="module">
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
              mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                sequence: { useMaxWidth: false, wrap: false, actorMargin: 80 }
              });
            </script>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f6f8fa; }
              h1 { color: #1f2328; border-bottom: 1px solid #d1d9e0; padding-bottom: 12px; }
              .info { background: #ddf4ff; border: 1px solid #54aeff; border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; }
              .info code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
              .mermaid { background: white; border: 1px solid #d1d9e0; border-radius: 6px; padding: 20px; overflow-x: auto; }
              pre { background: #1f2328; color: #e6edf3; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
              a { color: #0969da; }
              details { margin-bottom: 16px; }
              summary { cursor: pointer; font-weight: 600; color: #1f2328; }
            </style>
          </head>
          <body>
            <h1>TollGate Protocol Trace</h1>
            <div class="info">
              Auto-generated from <code>cdk_bootstrap_lifecycle</code> integration test run on <code>testnut.cashu.space</code>.
              See <a href="trace.json">trace.json</a> for machine-readable output.
            </div>
          HTMLEOF

          if [ -f "$TRACE_DIR/cdk_bootstrap_lifecycle.mmd" ]; then
            echo '<h2>Sequence Diagram</h2>' >> pages/index.html
            echo '<div class="mermaid">' >> pages/index.html
            cat "$TRACE_DIR/cdk_bootstrap_lifecycle.mmd" >> pages/index.html
            echo '</div>' >> pages/index.html
          fi

          if [ -f "$TRACE_DIR/cdk_bootstrap_lifecycle.md" ]; then
            echo '<details><summary>Step-by-step report</summary><pre>' >> pages/index.html
            cat "$TRACE_DIR/cdk_bootstrap_lifecycle.md" >> pages/index.html
            echo '</pre></details>' >> pages/index.html
          fi

          if [ -f "$TRACE_DIR/cdk_bootstrap_lifecycle.json" ]; then
            cp "$TRACE_DIR/cdk_bootstrap_lifecycle.json" pages/trace.json
            echo '<details><summary>Raw JSON trace</summary><pre>' >> pages/index.html
            cat "$TRACE_DIR/cdk_bootstrap_lifecycle.json" >> pages/index.html
            echo '</pre></details>' >> pages/index.html
          fi

          echo '</body></html>' >> pages/index.html

      - name: Upload protocol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-report
          path: |
            protocol-report.log
            build.log
          retention-days: 14

      - name: Upload protocol trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-trace
          path: |
            target/protocol-traces/
            pages/
          retention-days: 14

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::CDK integration tests failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  deploy-pages:
    name: Deploy Protocol Traces
    if: github.ref == 'refs/heads/experimental'
    needs: [cdk-integration]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
