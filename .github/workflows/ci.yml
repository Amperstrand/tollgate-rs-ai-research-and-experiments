            <script>
          var tooltipEl = null;

          function showTooltip(evt, ev) {
            if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
            var ar = ev.actor && ev.target ? ev.actor + ' \u2192 ' + ev.target : ev.actor || '';
            tooltipEl.innerHTML = '<div class="tt-type">' + ev.msg_type + '</div>'
              + '<div class="tt-row"><span class="tt-label">From\u2192To</span><span class="tt-val">' + ar + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Payload</span><span class="tt-val">' + ev.payload + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Spec</span><span class="tt-val">' + ev.spec_ref + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Dir</span><span class="tt-val">' + ev.direction + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Time</span><span class="tt-val">+' + ev.timestamp_ms + 'ms</span></div>';
            tooltipEl.style.display = 'block';
            moveTooltip(evt);
          }
          function moveTooltip(evt) {
            if (!tooltipEl) return;
            var x = evt.pageX + 12, y = evt.pageY + 12;
            if (x + 400 > window.innerWidth) x = evt.pageX - 400;
            tooltipEl.style.left = x + 'px';
            tooltipEl.style.top = y + 'px';
          }
          function hideTooltip() { if (tooltipEl) tooltipEl.style.display = 'none'; }

          function attachTooltips(events) {
            if (!events) return;
            var svgs = document.querySelectorAll('.mermaid svg');
            svgs.forEach(function(svg) {
              svg.querySelectorAll('.messageText').forEach(function(el, idx) {
                if (idx >= events.length) return;
                var ev = events[idx];
                el.style.cursor = 'pointer';
                el.addEventListener('mouseenter', function(e) { showTooltip(e, ev); });
                el.addEventListener('mousemove', moveTooltip);
                el.addEventListener('mouseleave', hideTooltip);
              });
            });
          }

          function waitForMermaid(callback) {
            var containers = document.querySelectorAll('.mermaid');
            var allReady = true;
            containers.forEach(function(c) {
              if (!c.querySelector('svg')) allReady = false;
            });
            if (allReady) { callback(); return; }
            new MutationObserver(function() {
              var ready = true;
              containers.forEach(function(c) {
                if (!c.querySelector('svg')) ready = false;
              });
              if (ready) { this.disconnect(); callback(); }
            }).observe(document.body, { childList: true, subtree: true });
          }

          function parseBalanceRemaining(p) { var m = p.match(/remaining:\s*(-?[\d.]+)\s*sat/); return m ? parseFloat(m[1]) : null; }
          function gaugeColor(pct) { return pct > 60 ? '#1a7f37' : pct > 30 ? '#9a6700' : '#cf222e'; }

          var BOOTSTRAP_STEP_INFO = {
            'MintQuote': {
              Request: {
                title: 'Buyer requests ecash from the Mint',
                explain: 'The Buyer needs digital cash to pay the Seller. It asks the Mint to create a Lightning invoice for new ecash. On testnet, the FakeWallet auto-pays instantly.'
              },
              Response: {
                title: 'Mint issues the ecash tokens',
                explain: 'The Mint creates ecash tokens and sends them to the Buyer. These are blind-signed proofs — the Mint can verify them later but cannot trace them to the Buyer.'
              }
            },
            'Announce': {
              Request: {
                title: 'Peer announces itself',
                explain: 'Each peer identifies itself as a TollGate node: protocol version (v1), what it meters (bytes), and capabilities (0x01 = Spilman channel support). No handshake needed — peers are already authenticated by the transport layer.'
              }
            },
            'PriceSheet': {
              Request: {
                title: 'Seller offers pricing',
                explain: 'The Seller sends a PriceSheet: one product at 10 sat/second + 1 sat/byte, with 1000\u00d7 scaling for sub-satoshi precision. This is a take-it-or-leave-it offer — the Buyer picks a product or disconnects.'
              }
            },
            'Accept': {
              Request: {
                title: 'Buyer accepts the offer',
                explain: 'The Buyer selects a product and proposes a metering interval range (2.5s\u201310s). Both sides deterministically compute the final interval as the midpoint of the overlapping range.'
              }
            },
            'BootstrapToken': {
              Request: {
                title: 'Buyer pays with Cashu ecash',
                explain: 'The Buyer creates a Cashu ecash token and sends it to the Seller. This is real digital cash — the Seller will verify it with the Mint before granting any access. No verification = no service.'
              }
            },
            'BootstrapAck': {
              Response: {
                title: 'Seller confirms payment accepted',
                explain: 'The Seller verified the token with the Mint and credited the Buyer\'s balance. Balance is tracked at 1000\u00d7 precision (milli-sats) so sub-sat costs accumulate correctly across metering intervals. The Buyer now has network access.'
              }
            },
            'MeteringReport': {
              Request: {
                title: 'Metering interval — both sides report usage',
                explain: 'Every ~5 seconds, both sides exchange cumulative counters: how many bytes delivered, how many received. The Seller deducts the interval cost from the Buyer\'s balance: cost = elapsed_ms \u00d7 pps + bytes_delivered \u00d7 ppu (all in scaled units).'
              }
            },
            'Disconnect': {
              Request: {
                title: 'Buyer disconnects',
                explain: 'The Buyer is done and sends Disconnect. The Seller confirms and immediately revokes network access. Any remaining bootstrap balance is kept by the Seller (v1 behavior).'
              }
            },
            'Balance': {
              Note: {
                title: 'Balance snapshot',
                explain: 'Both Buyer and Seller track the scaled balance independently. The Seller deducts cost after each metering interval using the formula: cost = elapsed_ms \u00d7 pps + bytes_delivered \u00d7 ppu (all at 1000\u00d7 scale). Remaining balance shown in satoshis.'
              }
            }
          };

          var SPILMAN_STEP_INFO = {
            'KeyGen': {
              Note: {
                title: 'Participant generates keypair',
                explain: 'Each participant generates a Secp256k1 keypair. The public keys will be used for ECDH to derive a shared channel secret.'
              }
            },
            'ECDH': {
              Note: {
                title: 'Computing shared channel secret via ECDH',
                explain: 'Alice and Charlie perform Elliptic Curve Diffie-Hellman: each multiplies their private key by the other\'s public key. Both get the same shared secret — this becomes the channel secret that seeds all deterministic proofs.'
              }
            },
            'KeysetFetch': {
              Request: {
                title: 'Fetching mint keyset for channel funding',
                explain: 'Alice needs the mint\'s active public keys to create blinded funding outputs. She fetches the current sat keyset and its DLEQ proofs.'
              }
            },
            'KeysetInfo': {
              Response: {
                title: 'Mint returns active keyset',
                explain: 'The mint provides the keyset ID, public keys, and input fee (ppk = per-thousand). This keyset is used for all channel proofs.'
              }
            },
            'ChannelParams': {
              Note: {
                title: 'Computing channel parameters',
                explain: 'The channel parameters bind: capacity (100 sat), funding amount (102 sat including fee buffer), keyset ID, both pubkeys, and timestamps. The channel ID is deterministically derived from these.'
              }
            },
            'ChannelId': {
              Note: {
                title: 'Channel ID computed',
                explain: 'The channel ID is a hash of the parameters and shared secret. It uniquely identifies this payment channel and is included in every balance update.'
              }
            },
            'FundingOutputs': {
              Note: {
                title: 'Creating deterministic blinded funding outputs',
                explain: 'Alice creates blinded messages using deterministic secrets derived from the channel secret. These will be minted into proofs that fund the channel. The deterministic construction means Charlie can independently verify them later.'
              }
            },
            'MintQuote': {
              Request: {
                title: 'Requesting mint quote for channel funding',
                explain: 'Alice requests the mint to create a Lightning invoice for the funding amount (102 sat). On testnet, the FakeWallet auto-pays the invoice instantly.'
              }
            },
            'MintProofs': {
              Response: {
                title: 'Mint issues blind signatures \u2192 proofs',
                explain: 'The mint blind-signs Alice\'s blinded messages. Alice unblinds them to get spendable proofs. These proofs are the channel\'s funding — locked by the channel parameters, not spendable outside the channel.'
              }
            },
            'VerifyChannel': {
              Note: {
                title: 'Charlie verifies the channel',
                explain: 'Charlie independently verifies: (1) DLEQ proofs confirm the mint signed correctly, (2) the total proof value matches the funding amount, (3) the secrets are deterministic from the shared channel secret. If any check fails, the channel is rejected.'
              }
            },
            'ChannelVerified': {
              Note: {
                title: 'Channel verified successfully',
                explain: 'All verification checks passed. The channel is now established with 100 sat capacity. Alice can begin sending signed balance updates.'
              }
            },
            'BalanceUpdate': {
              Request: {
                title: 'Alice signs a balance update',
                explain: 'Alice signs the cumulative balance (e.g., 10 sat) with her private key. This is a payment to Charlie — it proves Alice owes this amount. The signature is non-repudiable: Charlie can present it to the mint during settlement.'
              }
            },
            'BalanceAck': {
              Response: {
                title: 'Charlie verifies the balance update',
                explain: 'Charlie verifies Alice\'s signature against the channel parameters. The balance must be monotonically increasing (can only go up). If valid, Charlie accepts — this is money in the bank, settleable at any time.'
              }
            },
            'ChannelClose': {
              Request: {
                title: 'Cooperative channel close',
                explain: 'Alice initiates close at the last agreed balance (40 sat). In cooperative close, both parties agree on the final balance and settle immediately.'
              }
            },
            'SwapProofs': {
              Request: {
                title: 'Charlie swaps channel proofs for spendable tokens',
                explain: 'Charlie takes the proofs from the channel and swaps them at the mint for new, freely spendable tokens. This breaks the link between the channel and Charlie\'s wallet.'
              }
            },
            'SwapComplete': {
              Response: {
                title: 'Swap complete — Charlie has spendable tokens',
                explain: 'The mint swapped the channel proofs for new tokens. Charlie now has 40 sat in his wallet, spendable anywhere. The channel is settled.'
              }
            },
            'Refund': {
              Note: {
                title: 'Alice receives refund',
                explain: 'Alice gets back the unused capacity (100 - 40 = 60 sat). In a real channel, she would reclaim the remaining proofs. The channel is now fully closed.'
              }
            }
          };

          function renderTrace(text, containerId, rawId, stepInfo, actorMap) {
            var events = text.trim().split('\n').filter(function(l) { return l.length > 0; }).map(function(l) { return JSON.parse(l); });
            document.getElementById(rawId).textContent = text;

            if (events.length === 0) {
              document.getElementById(containerId).innerHTML = '<p class="no-data">No events recorded.</p>';
              return events;
            }

            var firstTs = events[0].timestamp_ms;
            var html = '';
            var balanceData = [];

            for (var i = 0; i < events.length; i++) {
              var e = events[i];
              var delta = e.timestamp_ms - firstTs;
              var dir = e.direction;

              var actorClass = '';
              if (actorMap && actorMap[e.actor]) actorClass = actorMap[e.actor];
              else actorClass = e.actor === 'Buyer' || e.actor === 'Alice' ? 'actor-buyer' : e.actor === 'Seller' || e.actor === 'Charlie' ? 'actor-seller' : e.actor === 'Mint' ? 'actor-mint' : '';
              if (dir === 'Note') actorClass = 'note';
              var dirLabel = dir === 'Response' ? 'Response' : dir === 'Note' ? 'Note' : 'Request';

              var info = (stepInfo[e.msg_type] || {})[dir] || { title: e.msg_type, explain: '' };

              var arrow = (e.actor && e.target) ? e.actor + ' \u2192 ' + e.target : e.actor || '';

              html += '<div class="step">'
                + '<div class="step-head">'
                + '<span class="step-num">#' + (i + 1) + '</span>'
                + '<span class="step-dir ' + actorClass + '">' + dirLabel + '</span>'
                + '<span class="step-title">' + info.title + '</span>'
                + '</div>'
                + '<p class="step-explain">' + info.explain + '</p>'
                + '<div class="step-meta">'
                + '<span>' + arrow + '</span>'
                 + '<span><code>' + e.payload.replace(/<br\/>/g, '<br>') + '</code></span>'
                + '<span>Spec: <code>' + e.spec_ref + '</code></span>'
                + '<span>+' + delta + 'ms</span>'
                + '</div>';

              if (e.msg_type === 'Balance') {
                 var rem = parseBalanceRemaining(e.payload);
                 if (rem !== null) {
                   var pct = Math.min(100, Math.max(0, (rem / 100) * 100));
                   html += '<div class="balance-gauge"><div class="balance-gauge-fill" style="width:' + pct + '%;background:' + gaugeColor(pct) + '"></div></div>';
                   balanceData.push({ step: i + 1, val: rem });
                }
              }

              html += '</div>';
            }

            document.getElementById(containerId).innerHTML = html;

            if (balanceData.length > 0 && containerId === 'steps-bootstrap') {
              var maxAbs = 0;
              for (var b = 0; b < balanceData.length; b++) { var av = Math.abs(balanceData[b].val); if (av > maxAbs) maxAbs = av; }
              var tlHtml = '';
              for (var b = 0; b < balanceData.length; b++) {
                var bd = balanceData[b];
                var isNeg = bd.val < 0;
                var h = isNeg ? 2 : Math.round((bd.val / (maxAbs > 0 ? maxAbs : 1)) * 80);
                var gc = isNeg ? '#cf222e' : gaugeColor(Math.min(100, (bd.val / 100) * 100));
                tlHtml += '<div class="balance-bar">'
                  + '<div class="balance-bar-val">' + bd.val.toFixed(1) + '</div>'
                  + '<div class="balance-bar-fill" style="height:' + Math.max(2, h) + 'px;background:' + gc + '"></div>'
                  + '<div class="balance-bar-label">#' + bd.step + '</div>'
                  + '</div>';
              }
              document.getElementById('balance-timeline').innerHTML = tlHtml;
            }

            return events;
          }

          var allEvents = [];

          var CLAIM_SCENARIOS = {
            cooperate: {
              title: 'Cooperative close: both parties agree on the latest balance',
              body: 'Alice has signed the channel up to 40 sat. Charlie accepts that as final, settles his earned amount, and Alice receives the unused remainder as change.',
              steps: [
                'Alice signs the latest cumulative balance with <span class="call-pill">create_signed_balance_update(..., 40)</span>.',
                'Charlie verifies the update belongs to this channel and is not lower than the previous balance.',
                'Charlie settles the 40 sat claim with the mint; Alice gets the 60 sat remainder.'
              ]
            },
            force: {
              title: 'Receiver force-close: Charlie uses SatsAndSports unilateral close',
              body: 'Charlie does not need Alice online once he has a valid signed update. In SatsAndSports terms, this is the unilateral close path: Charlie presents the latest update he holds and can claim exactly that amount, not more.',
              steps: [
                'Charlie keeps the newest valid <span class="call-pill">BalanceUpdate</span> signature from Alice.',
                'If Alice disappears, Charlie submits that latest state through <span class="call-pill">/channel/{id}/unilateral-close</span>.',
                'The mint-side split pays Charlie the signed balance and preserves Alice\'s remaining change/refund path.'
              ]
            },
            timeout: {
              title: 'Sender timeout refund: Alice waits until the refund path unlocks',
              body: 'The channel is funded as a locked token: Charlie can claim signed balances before expiry, but Alice has a time-locked refund path in the funding token. This is separate from the close endpoint.',
              steps: [
                'Alice cannot simply claw back the box while the channel is live.',
                'After <span class="call-pill">expiry_timestamp</span>, the sender refund condition becomes valid.',
                'If Charlie never settles, Alice uses the timeout/refund path to recover what was not rightfully claimed.'
              ]
            }
          };

          function renderClaimScenario(key) {
            var scenario = CLAIM_SCENARIOS[key] || CLAIM_SCENARIOS.cooperate;
            var out = document.getElementById('claim-scenario');
            if (!out) return;
            out.innerHTML = '<h4>' + scenario.title + '</h4>'
              + '<p>' + scenario.body + '</p>'
              + '<ol class="claim-steps"><li>' + scenario.steps.join('</li><li>') + '</li></ol>';
            document.querySelectorAll('.scenario-buttons button').forEach(function(btn) {
              btn.classList.toggle('active', btn.getAttribute('data-scenario') === key);
            });
          }

          document.querySelectorAll('.scenario-buttons button').forEach(function(btn) {
            btn.addEventListener('click', function() { renderClaimScenario(btn.getAttribute('data-scenario')); });
          });
          renderClaimScenario('cooperate');

          function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          function renderClaimLab(lab) {
            var h = '';
            h += '<p style="color:var(--muted);font-size:0.82rem;margin-bottom:12px;font-style:italic">' + escHtml(lab.warning) + '</p>';
            h += '<div style="font-size:0.85rem;margin-bottom:14px">';
            h += '<strong>Channel:</strong> <code>' + escHtml(lab.channel_id.substring(0, 20)) + '…</code> ';
            h += '| <strong>Capacity:</strong> ' + lab.capacity_sat + ' sat ';
            h += '| <strong>Latest balance:</strong> ' + lab.latest_balance_sat + ' sat ';
            h += '| <strong>Refund:</strong> ' + lab.refund_sat + ' sat';
            h += '</div>';

            h += '<div class="claim-lab-grid">';
            h += '<div class="claim-lab-card" style="border-left:3px solid var(--buyer)">';
            h += '<h4 style="color:var(--buyer)">🔑 Alice (Buyer / Sender)</h4>';
            h += '<div style="font-size:0.82rem;margin-bottom:6px"><strong>Public key:</strong> <code>' + escHtml(lab.buyer.pubkey_hex.substring(0, 32)) + '…</code></div>';
            h += '<div style="font-size:0.82rem;margin-bottom:6px"><strong>Can do now:</strong><ul style="margin:4px 0 0 16px">';
            lab.buyer.can_do_now.forEach(function(a) { h += '<li>' + escHtml(a) + '</li>'; });
            h += '</ul></div>';
            h += '<div style="font-size:0.82rem"><strong>After timeout:</strong> ' + escHtml(lab.buyer.can_do_after_timeout) + '</div>';
            h += '</div>';

            h += '<div class="claim-lab-card" style="border-left:3px solid var(--seller)">';
            h += '<h4 style="color:var(--seller)">🔑 Charlie (Seller / Receiver)</h4>';
            h += '<div style="font-size:0.82rem;margin-bottom:6px"><strong>Public key:</strong> <code>' + escHtml(lab.seller.pubkey_hex.substring(0, 32)) + '…</code></div>';
            h += '<div style="font-size:0.82rem"><strong>Can do now:</strong><ul style="margin:4px 0 0 16px">';
            lab.seller.can_do_now.forEach(function(a) { h += '<li>' + escHtml(a) + '</li>'; });
            h += '</ul></div>';
            h += '</div>';

            h += '</div>';

            h += '<div style="margin:18px 0 16px">';
            h += '<div style="font-size:0.82rem;font-weight:600;margin-bottom:6px">⏱ Timelock countdown</div>';
            h += '<div class="timelock"></div>';
            h += '<div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-top:22px">';
            h += '<span>Setup: ' + new Date(lab.setup_timestamp * 1000).toISOString().replace('.000Z', 'Z') + '</span>';
            h += '<span>Expiry: ' + new Date(lab.expiry_timestamp * 1000).toISOString().replace('.000Z', 'Z') + '</span>';
            h += '</div>';
            h += '</div>';

            var paths = [
              { key: 'cooperative', icon: '🤝', label: 'Cooperative close' },
              { key: 'unilateral', icon: '⚡', label: 'Unilateral force-close' },
              { key: 'timeout', icon: '⏰', label: 'Timeout refund' }
            ];

            paths.forEach(function(p) {
              var cp = lab.claim_paths[p.key];
              h += '<div style="margin:14px 0;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:#fbfcfd">';
              h += '<div style="font-weight:600;font-size:0.92rem;margin-bottom:8px">' + p.icon + ' ' + p.label + '</div>';
              h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
              h += '<div style="font-size:0.82rem"><strong style="color:var(--buyer)">Buyer action:</strong> ' + escHtml(cp.buyer_action) + '</div>';
              h += '<div style="font-size:0.82rem"><strong style="color:var(--seller)">Seller action:</strong> ' + escHtml(cp.seller_action) + '</div>';
              h += '</div>';
              h += '<div style="margin-top:10px;font-size:0.78rem;color:var(--muted)">Demo command:</div>';
              h += '<div class="claim-lab-code">' + escHtml(cp.demo_command) + '</div>';
              h += '</div>';
            });

            var sharedPreview = {};
            Object.keys(lab.shared).forEach(function(k) {
              var v = lab.shared[k];
              if (typeof v === 'string' && v.length > 200) {
                sharedPreview[k] = v.substring(0, 200) + '… (' + v.length + ' chars total)';
              } else {
                sharedPreview[k] = v;
              }
            });
            h += '<details style="margin-top:16px">';
            h += '<summary>Shared artifacts (JSON — truncated preview)</summary>';
            h += '<div class="claim-lab-code">' + escHtml(JSON.stringify(sharedPreview, null, 2)) + '</div>';
            h += '</details>';

            document.getElementById('claim-lab-content').innerHTML = h;
          }

          fetch('trace.json')
            .then(function(r) { return r.ok ? r.text() : Promise.reject('no trace'); })
            .then(function(text) {
              var evts = renderTrace(text, 'steps-bootstrap', 'raw-json-bootstrap', BOOTSTRAP_STEP_INFO);
              allEvents = allEvents.concat(evts);
            })
            .catch(function() {
              document.getElementById('steps-bootstrap').innerHTML = '<p class="no-data">No bootstrap trace data available — the test may not have completed.</p>';
            });

          fetch('spilman-trace.json')
            .then(function(r) { return r.ok ? r.text() : Promise.reject('no trace'); })
            .then(function(text) {
              var evts = renderTrace(text, 'steps-spilman', 'raw-json-spilman', SPILMAN_STEP_INFO);
              allEvents = allEvents.concat(evts);
            })
            .catch(function() {
              document.getElementById('steps-spilman').innerHTML = '<p class="no-data">No Spilman trace data available — the test may not have completed.</p>';
            });

          fetch('spilman-claim-lab.json')
            .then(function(r) { return r.ok ? r.json() : Promise.reject('no claim lab'); })
            .then(function(lab) { renderClaimLab(lab); })
            .catch(function() {
              document.getElementById('claim-lab-content').innerHTML = '<p class="no-data">No claim lab data — the Spilman test may not have produced the artifact.</p>';
            });

          var channelStates = [];
          var msgStateMap = [];
          fetch('spilman-channel-states.json')
            .then(function(r) { return r.ok ? r.json() : Promise.reject('no states'); })
            .then(function(s) {
              channelStates = s;
              msgStateMap = s.reduce(function(m, st, i) {
                if (st.direction === 'Request' || st.direction === 'Response') m.push(i);
                return m;
              }, []);
            })
            .catch(function() { /* states not available */ });

          function superscript(n) {
            var sups = {'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
            return String(n).split('').map(function(c) { return sups[c] || c; }).join('');
          }

          function decomposeDenoms(amount) {
            if (amount <= 0) return '0';
            var parts = [];
            for (var d = 1; d <= amount; d *= 2) {
              if (amount & d) parts.unshift(d);
            }
            return parts.join(' + ');
          }

          var popupEl = null;
          function closeStatePopup() { if (popupEl) popupEl.style.display = 'none'; }

          function showStatePopup(stepIdx, x, y) {
            if (!popupEl) popupEl = document.getElementById('state-popup');
            if (!channelStates || stepIdx >= channelStates.length) return;
            var s = channelStates[stepIdx];
            var cs = s.channel_state;
            var html = '';

            html += '<div class="sp-state-grid">';
            html += '<div class="sp-state-card" style="border-left:3px solid var(--buyer)"><h5 style="color:var(--buyer)">🔑 Alice (Buyer)</h5><ul>';
            cs.alice_holds.forEach(function(h) { html += '<li>' + escHtml(h) + '</li>'; });
            html += '</ul></div>';
            html += '<div class="sp-state-card" style="border-left:3px solid var(--seller)"><h5 style="color:var(--seller)">🔑 Charlie (Seller)</h5><ul>';
            cs.charlie_holds.forEach(function(h) { html += '<li>' + escHtml(h) + '</li>'; });
            html += '</ul></div></div>';

            if (cs.alice_proofs.length > 0) {
              var totalFunding = cs.alice_proofs.reduce(function(a,p) { return a + p.amount; }, 0);
              var maxDenom = Math.pow(2, Math.floor(Math.log2(totalFunding)));

              var denoms = [];
              for (var d = 1; d <= maxDenom; d *= 2) denoms.push(d);
              denoms.reverse();

              var proofAmounts = cs.alice_proofs.map(function(p) { return p.amount; });

              html += '<div class="sp-denom-section">';
              html += '<div class="sp-denom-title">Token Denominations (' + totalFunding + ' sat)</div>';
              html += '<div class="sp-denom-bar">';

              denoms.forEach(function(den) {
                var count = proofAmounts.filter(function(a) { return a === den; }).length;
                var power = Math.log2(den);
                var widthPct = Math.max(8, (den / maxDenom) * 100);
                if (count > 0) {
                  html += '<div class="sp-denom-block" style="width:' + widthPct + '%;background:#0969da;color:#fff">';
                  html += '<div class="sp-denom-amount">' + den + ' sat</div>';
                  html += '<div class="sp-denom-power">2' + superscript(power) + '</div>';
                  if (count > 1) html += '<div class="sp-denom-count">\u00D7' + count + '</div>';
                  html += '</div>';
                } else {
                  html += '<div class="sp-denom-block" style="width:' + widthPct + '%;background:#eff2f5;color:#8b949e;opacity:0.5">';
                  html += '<div class="sp-denom-amount">' + den + '</div>';
                  html += '</div>';
                }
              });

              html += '</div>';
              html += '<div class="sp-denom-legend">';
              html += '<span class="sp-denom-legend-dot" style="background:#0969da"></span>Funded token &nbsp; ';
              html += '<span class="sp-denom-legend-dot" style="background:#eff2f5;border:1px solid #d1d9e0"></span>Not used';
              html += '</div>';

              var balance = cs.cumulative_balance_sat;
              var remaining = cs.capacity_remaining_sat;
              var isSettlement = s.msg_type === 'ChannelClose' || s.msg_type === 'SwapProofs' || s.msg_type === 'SwapComplete' || s.msg_type === 'Refund' || (s.msg_type && s.msg_type.indexOf('ClaimPath') === 0);
              if (isSettlement) {
                html += '<div class="sp-denom-split">';
                html += '<div style="display:flex;justify-content:space-between;margin-top:4px">';
                html += '<div><span style="color:var(--seller);font-weight:600">Charlie settles:</span> ' + balance + ' sat = ' + decomposeDenoms(balance) + '</div>';
                html += '</div>';
                html += '<div style="display:flex;justify-content:space-between">';
                html += '<div><span style="color:var(--buyer);font-weight:600">Alice refund:</span> ' + remaining + ' sat = ' + decomposeDenoms(remaining) + '</div>';
                html += '</div></div>';
              }

              html += '</div>';
            }

            if (cs.alice_proofs.length > 0) {
              html += '<div style="margin-bottom:12px"><div style="font-size:0.8rem;font-weight:600;margin-bottom:4px">Proofs in channel</div>';
              cs.alice_proofs.forEach(function(p, pi) {
                html += '<div class="sp-proof-row"><span class="sp-proof-amount">' + p.amount + ' sat</span><span class="sp-proof-hex">' + escHtml(p.secret_preview) + '</span>';
                html += '<button class="sp-copy-btn" onclick="navigator.clipboard.writeText(window._spFullSecrets[' + pi + '])">copy</button></div>';
              });
              html += '</div>';
            }

            var balPct = cs.capacity_remaining_sat > 0 ? (cs.cumulative_balance_sat / (cs.cumulative_balance_sat + cs.capacity_remaining_sat)) * 100 : 100;
            html += '<div style="margin-bottom:12px"><div style="font-size:0.8rem;font-weight:600">Balance: ' + cs.cumulative_balance_sat + ' sat paid / ' + cs.capacity_remaining_sat + ' sat remaining</div>';
            html += '<div class="sp-balance-bar"><div class="sp-balance-bar-fill" style="width:' + balPct + '%;background:var(--seller)"></div><div class="sp-balance-bar-fill" style="width:' + (100 - balPct) + '%;background:var(--buyer);opacity:0.4"></div></div></div>';

            if (cs.latest_signature_preview) {
              html += '<div style="font-size:0.78rem;color:var(--muted);margin-bottom:12px">Latest sig: <code>' + escHtml(cs.latest_signature_preview) + '…</code></div>';
            }

            var cp = s.claim_paths;
            var anyAvailable = cp.cooperative.available || cp.unilateral.available || cp.timeout.available;
            if (anyAvailable) {
              html += '<div class="sp-claim-tabs">';
              html += '<button class="sp-claim-tab active" data-sp-tab="cooperative" onclick="window._switchClaimTab(\'cooperative\')">🤝 Cooperate</button>';
              html += '<button class="sp-claim-tab" data-sp-tab="unilateral" onclick="window._switchClaimTab(\'unilateral\')">⚡ Force-close</button>';
              html += '<button class="sp-claim-tab" data-sp-tab="timeout" onclick="window._switchClaimTab(\'timeout\')">⏰ Timeout</button>';
              html += '</div>';
              html += '<div id="sp-claim-output">';
              html += renderClaimTab(cp, 'cooperative');
              html += '</div>';
              window._spClaimPaths = cp;
            } else {
              html += '<div style="font-size:0.82rem;color:var(--muted);font-style:italic;padding:8px 0">No claim paths available at this step.</div>';
            }

            document.getElementById('sp-title').textContent = 'Step ' + (stepIdx + 1) + ': ' + s.msg_type;
            document.getElementById('sp-body').innerHTML = html;
            window._spFullSecrets = cs.alice_proofs.map(function(p) { return p.full_secret || p.secret_preview; });

            popupEl.style.display = 'block';
            var pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;
            var left = x + 16, top = y - 20;
            if (left + pw > window.innerWidth - 16) left = x - pw - 16;
            if (top + ph > window.innerHeight - 16) top = window.innerHeight - ph - 16;
            if (top < 16) top = 16;
            popupEl.style.left = left + 'px';
            popupEl.style.top = top + 'px';
          }

          function renderClaimTab(cp, key) {
            var p = cp[key];
            var html = '<div class="sp-claim-content">';
            html += '<div class="sp-claim-row">';
            html += '<div><div class="sp-claim-label" style="color:var(--buyer)">Buyer gets</div><div class="sp-claim-val">' + (p.buyer_gets || 'nothing') + '</div></div>';
            html += '<div><div class="sp-claim-label" style="color:var(--seller)">Seller gets</div><div class="sp-claim-val">' + (p.seller_gets || 'nothing') + '</div></div>';
            html += '</div>';
            if (p.buyer_action) html += '<div class="sp-claim-row"><div><div class="sp-claim-label">Buyer action</div><div class="sp-claim-val">' + escHtml(p.buyer_action) + '</div></div>';
            if (p.seller_action) html += '<div><div class="sp-claim-label">Seller action</div><div class="sp-claim-val">' + escHtml(p.seller_action) + '</div></div></div>';
            html += '</div>';
            return html;
          }

          window._switchClaimTab = function(key) {
            document.querySelectorAll('.sp-claim-tab').forEach(function(t) {
              t.classList.toggle('active', t.getAttribute('data-sp-tab') === key);
            });
            var out = document.getElementById('sp-claim-output');
            if (out && window._spClaimPaths) out.innerHTML = renderClaimTab(window._spClaimPaths, key);
          };

          function attachStateClickHandlers() {
            var svgs = document.querySelectorAll('.mermaid svg');
            if (svgs.length < 2) return;
            var svg = svgs[1];
            svg.style.cursor = 'pointer';
            svg.addEventListener('click', function(e) {
              var texts = svg.querySelectorAll('.messageText');
              var lines = svg.querySelectorAll('.messageLine0, .messageLine1');
              var clickedIdx = -1;

              for (var i = 0; i < texts.length; i++) {
                var r = texts[i].getBoundingClientRect();
                if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                  clickedIdx = i; break;
                }
              }
              if (clickedIdx === -1) {
                for (var j = 0; j < lines.length; j++) {
                  var lr = lines[j].getBoundingClientRect();
                  if (e.clientX >= lr.left - 8 && e.clientX <= lr.right + 8 && e.clientY >= lr.top - 12 && e.clientY <= lr.bottom + 12) {
                    clickedIdx = j; break;
                  }
                }
              }
              var stateIdx = msgStateMap[clickedIdx];
              if (clickedIdx >= 0 && stateIdx !== undefined && channelStates[stateIdx]) {
                showStatePopup(stateIdx, e.pageX, e.pageY);
              }
            });
          }

          waitForMermaid(function() {
            attachTooltips(allEvents);
            setTimeout(attachStateClickHandlers, 500);
          });

          // Scroll spy for nav highlighting
          var sections = ['bootstrap', 'spilman'];
          var navLinks = document.querySelectorAll('nav.section-nav a[data-section]');
          function updateNav() {
            var scrollY = window.scrollY + 80;
            var current = sections[0];
            for (var i = 0; i < sections.length; i++) {
              var el = document.getElementById(sections[i]);
              if (el && el.offsetTop <= scrollY) current = sections[i];
            }
            navLinks.forEach(function(a) {
              a.classList.toggle('active', a.getAttribute('data-section') === current);
            });
          }
          window.addEventListener('scroll', updateNav, { passive: true });
          updateNav();
            </script>
            <div id="tooltip"></div>
             <div id="state-popup">
               <div class="sp-header"><h4 id="sp-title">Channel State</h4><button class="sp-close" id="sp-close">&times;</button></div>
               <div class="sp-body" id="sp-body"></div>
             </div>
             <script>document.getElementById('sp-close').addEventListener('click', function() { var p = document.getElementById('state-popup'); if (p) p.style.display = 'none'; });</script>
            </body>
          </html>
          HTMLEOF

          # Copy trace JSON files
          if [ -f "traces/bootstrap/cdk_bootstrap_lifecycle.json" ]; then
            cp "traces/bootstrap/cdk_bootstrap_lifecycle.json" pages/trace.json
          fi
          if [ -f "traces/spilman/spilman_channel_lifecycle.json" ]; then
            cp "traces/spilman/spilman_channel_lifecycle.json" pages/spilman-trace.json
          fi
          if [ -f "traces/spilman/spilman_claim_lab.json" ]; then
            cp "traces/spilman/spilman_claim_lab.json" pages/spilman-claim-lab.json
          fi
          if [ -f "traces/spilman/spilman_channel_states.json" ]; then
            cp "traces/spilman/spilman_channel_states.json" pages/spilman-channel-states.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    name: Deploy Protocol Traces
    if: github.ref == 'refs/heads/experimental'
    needs: [build-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
