# cargo-audit policy (the CI audit job reads this).
# Every ignore below is a VULNERABILITY ACCEPT with a reason and a trigger —
# none is silent. Re-audit on every rumqttc / cdk-spilman / rustls bump.

[advisories]
ignore = [
    # ---- rumqttc chain: rumqttc 0.24.0 pins rustls 0.22 + rustls-webpki
    # ---- 0.102; both lines are EOL with fixes only in 0.23.x/0.103.x.
    # ---- Removal of this whole block tracks issue #91 (spilman/rumqttc
    # ---- realignment); the affected code is the OPTIONAL
    # ---- tollgate-charger-host `real-broker` MQTT uplink.
    "RUSTSEC-2026-0346",  # rustls 0.22: Debug impls expose TLS secrets (fixed 0.23.46 only)
    "RUSTSEC-2026-0349",  # rustls 0.22: ServerHello downgrade to classical KX (fixed 0.23.46 only)
    "RUSTSEC-2026-0382",  # rustls-webpki 0.102: distrusted emSign intermediates (fixed 0.103.16)
    "RUSTSEC-2026-0049",  # rustls-webpki 0.102: CRL DistributionPoint matching (fixed 0.103.10)
    "RUSTSEC-2026-0099",  # rustls-webpki 0.102: wildcard name constraints (fixed 0.103.12)
    "RUSTSEC-2026-0098",  # rustls-webpki 0.102: URI name constraints (fixed 0.103.12)
    "RUSTSEC-2026-0104",  # rustls-webpki 0.102: CRL parsing panic (fixed 0.103.13)
    # ---- rsa Marvin Attack: NO patched release exists (upstream tracking
    # ---- RustCrypto/RSA#626; patched=[] is intentional). Transitive dep
    # ---- (cdk wallet chain), not used for key material at rest here.
    "RUSTSEC-2023-0071",
]
