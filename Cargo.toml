[workspace]
resolver = "2"
members = [
    "crates/tollgate-core",
    "crates/tollgate-net",
]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/Amperstrand/tollgate-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

# Patch cdk-sqlite to remove unconditional "test" feature on cdk-common.
# Upstream bug: cdk-sqlite enables cdk-common's "test" feature unconditionally,
# pulling in AtomicU64 — breaks MIPS cross-compilation.
# Fork: https://github.com/Amperstrand/cdk/tree/fix/v0.16-remove-test-feature
[patch.crates-io]
cdk-sqlite = { git = "https://github.com/Amperstrand/cdk.git", branch = "fix/v0.16-remove-test-feature" }
cdk-common = { git = "https://github.com/Amperstrand/cdk.git", branch = "fix/v0.16-remove-test-feature" }
cdk-sql-common = { git = "https://github.com/Amperstrand/cdk.git", branch = "fix/v0.16-remove-test-feature" }
