[workspace]
resolver = "2"
members = [
    "crates/tollgate-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/Amperstrand/tollgate-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
